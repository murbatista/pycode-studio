name: PyCode Studio tests

on:
  pull_request:
    branches: [main]
    paths:
      - "PyCode_Studio_Professor_Online_GitHub/**"
      - ".github/workflows/pycode-tests.yml"
  push:
    branches: [correcao-pycode-studio]
    paths:
      - "PyCode_Studio_Professor_Online_GitHub/**"
      - ".github/workflows/pycode-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PyCode_Studio_Professor_Online_GitHub
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Executar testes do backend
        run: python -m unittest discover -s tests -v
